# Virgo Core — selectable persistent profile
# Profiles: low, balanced, performance, extreme
PROFILE=balanced
ENABLE_GAME_TUNING=1
GAME_NICE=-2
ENABLE_REFRESH_LOCK=0
LOCKED_REFRESH_RATE_HZ=120
ENABLE_MULTI_TOUCH=1
ENABLE_FIXED_PERFORMANCE_MODE=0
EXTREME_MODE=0
POLL_INTERVAL_SEC=2
GAME_EXIT_POLLS=3

# v6.2 additions: game-scoped frequency control and explicit memory policy
ENABLE_FREQ_CONTROL=0
CPU_GOVERNOR=schedutil
CPU_MIN_FREQ=0
CPU_MAX_FREQ=0
GPU_GOVERNOR=performance
GPU_MAX_FREQ=0
ENABLE_BG_CLEANUP=0
PROTECT_PACKAGES="com.pubg.imobile com.android.systemui com.google.android.gms"
KILL_PACKAGES=""
START_AT_BOOT=1

# v6.4 real telemetry and diagnostics
DIAG_HOST=1.1.1.1
DIAG_COUNT=8
ENABLE_DEVICE_REPORT=1
ENABLE_CHARGE_TELEMETRY=1
ENABLE_FREQ_REPORT=1
ENABLE_DESYNC_DIAGNOSTICS=1

# Touch and smoothness levels
TOUCH_SENSITIVITY=50
SMOOTHNESS_LEVEL=50

# Premium Suite Settings (VIP Gaming)
PREM_HEADSHOT=0
PREM_ZERO_RECOIL=0
ZR_STRENGTH=2
PREM_AI_AIM=0
AIM_SENS=2
PREM_GYRO_FIX=0
PREM_DESYNC_FIX=0
PREM_BULL_REG=0
PREM_BGMI_NET=0
PREM_ULTRA_INSTINCT=0
PREM_CONN_PRIORITY=0
PREM_EXTREME_TOUCH=0
PREM_FPS_UNLOCK=0
PREM_THERMAL_DISABLE=0
PREM_SCREEN_SMOOTH=0
PREM_IOS_STABILITY=0
PREM_VIDEO_SMOOTH=0
PREM_SNAP_RESP=0
PREM_FRAME_PHASE=0
PREM_RAM_GUARD=0
PREM_AUDIO_LAT=0
PREM_THREAD_PIN=0
PREM_JITTER_ABS=0
PREM_STORAGE_BURST=0
PREM_ENTROPY_BOOST=0
PREM_MEMORY_ULTRA=0

# Gemini Vision AI Aim Settings
ENABLE_GEMINI_AIM=1
GEMINI_MODEL=gemini-3.5-flash-lite
POLL_INTERVAL_MS=20
